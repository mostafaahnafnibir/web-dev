<!DOCTYPE html>
<html>
    <head>
    <title>
        Forms in HTML
    </title>
    </head>
    <body>
        <fieldset>
            <legend><h2>Personal Information</h2></legend>
        <form>

        <label >Full Name <input type="text"></label><br><br>
        <label>Email Address <input type="text"></label><br><br>
        <label>Phone No. <input type="password" name="" id=""></label><br><br>
        <label> Gender </label><br>
         <input type="radio" name="Male" id="male">male
        <input type="radio" name="Female" id="Female">Female
        <br><br>
        <label>Date of Birth <input type="date" name="" id=""></label> <br><br>
        <label> Current Location</label><br>
        <input type="checkbox" name="" id="">Dhaka <br>
        <input type="checkbox" name="" id="">CTG <br>
        <input type="checkbox" name="" id="">Sylhet <br>
        <input type="checkbox" name="" id="">BOgura <br><br>
        <label >
            Blood Group
        </label>
        <select >
            <option value="O+">O+</option>
            <option value="A+">A+</option>
            <option value="B+">B+</option>
            <option value="O-">O-</option>
            <option value="A-">A-</option>
            <option value="B-">B-</option>
            <option value="AB">AB+</option>
            <option value="AB-">AB-</option>
        </select><br><br>
        <center>
        <input style="width: 100px; height: 50px;" type="submit" value="SUBMIT"> </center>
        </fieldset>
        </form>
    </body>
</html>
